<!DOCTYPE html>
<html lang="zh-CN" data-glass="frosted">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC Switch</title>
    <script>(function(){try{var t=localStorage.getItem("cc-switch-theme")||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})()</script>
  </head>
  <body class="quota-widget">
    <div id="root"></div>
    <script type="module" src="./quota-widget/main.tsx"></script>
  </body>
</html>
